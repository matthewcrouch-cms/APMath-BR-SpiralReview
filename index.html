<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spiral Check · AP Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#0f2a43; --ink-soft:#4a6178; --paper:#f3f7fb; --surface:#ffffff; --line:#d3deea;
  --blue:#4b9cd3; --blue-tint:#e3f0fa; --orange:#f56600; --orange-tint:#fff0e3;
  --good:#17693a; --good-tint:#e1f4e8; --bad:#a3261f; --bad-tint:#fbe7e5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8f1f8; --ink-soft:#a5b8c9; --paper:#0a1827; --surface:#112338; --line:#27405a;
    --blue-tint:#143049; --orange-tint:#3a2412;
    --good:#7fd9a2; --good-tint:#12301f; --bad:#ff9d94; --bad-tint:#3a1916;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e8f1f8; --ink-soft:#a5b8c9; --paper:#0a1827; --surface:#112338; --line:#27405a;
  --blue-tint:#143049; --orange-tint:#3a2412;
  --good:#7fd9a2; --good-tint:#12301f; --bad:#ff9d94; --bad-tint:#3a1916;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--text);font-size:18px;line-height:1.5;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0f2a43;z-index:10}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.band{background:#0f2a43;color:#fff;border-bottom:4px solid var(--orange);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.band-inner{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:14px}
.logo{height:58px;width:auto;display:block;flex:none}
.band h1{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;margin:0;color:#fff}
.band p{margin:0;font-size:14px;color:#a9d2ee}
.band .switch{margin-left:auto;background:transparent;border:2px solid #fff;color:#fff;border-radius:6px;padding:6px 12px;font-size:15px;cursor:pointer}
.band .switch:hover{background:#fff;color:#0f2a43}

main{max-width:760px;margin:0 auto;padding:22px 18px 70px}
main.wide{max-width:1040px}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:6px 0 4px}
h3{font-family:var(--display);font-weight:700;font-size:24px;margin:30px 0 8px}
.lede{color:var(--ink-soft);margin:0 0 20px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px;color:var(--ink-soft);margin-bottom:10px;align-items:center}
.crumbs button{background:none;border:0;padding:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer}
.list{display:grid;gap:10px}
.choice{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;min-height:56px}
.choice:hover{border-color:var(--blue)}
.choice .main{font-weight:600}
.choice .sub{display:block;color:var(--ink-soft);font-size:15px;font-weight:400}
.choice[disabled]{opacity:.55;cursor:not-allowed}
.tag{font-size:14px;border-radius:999px;padding:2px 10px;background:var(--blue-tint);color:var(--ink);white-space:nowrap}
.tag.done{background:var(--good-tint);color:var(--good)}
.tag.warn{background:var(--orange-tint)}
input[type=text],input[type=password],select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:12px 14px;min-height:50px}
.names{max-height:56vh;overflow-y:auto;margin-top:12px;padding-right:4px}
.btn{background:var(--orange);color:#0f2a43;border:0;border-radius:10px;padding:13px 22px;font-weight:700;font-size:18px;cursor:pointer;min-height:50px}
.btn:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);font-weight:600}
.btn.small{padding:8px 14px;font-size:15px;min-height:40px}

.q{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:18px 18px 8px;margin-bottom:18px}
.q .topic{font-size:14px;color:var(--ink-soft);margin-bottom:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px}
a.calc-link{display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap}
.q .prompt{margin:0 0 12px;font-size:19px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:2px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--blue)}
.opt input{margin-top:6px;accent-color:var(--orange);width:18px;height:18px;flex:none}
.opt .letter{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.3;width:20px;flex:none}
.opt.selected{border-color:var(--orange);background:var(--orange-tint)}
.opt.right{border-color:var(--good);background:var(--good-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt .verdict{margin-left:auto;font-size:14px;font-weight:600;white-space:nowrap;padding-left:8px}
.why{border-left:4px solid var(--blue);padding:4px 0 4px 14px;margin:6px 0 14px;font-size:17px}
.score{display:flex;align-items:baseline;gap:14px;margin:6px 0 16px}
.score .big{font-family:var(--display);font-weight:700;font-size:72px;line-height:1}
.notice{background:var(--blue-tint);border-radius:10px;padding:12px 16px;margin:0 0 18px;font-size:16px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.stat .l{color:var(--ink-soft);font-size:15px}
.scroll{overflow-x:auto;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:16px;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--display);font-size:19px;font-weight:700;background:var(--blue-tint)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-tint)}
.bar{height:10px;border-radius:5px;background:var(--line);min-width:90px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue)}
.bar.low>span{background:var(--orange)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0}
.row select{width:auto;min-width:200px}
.muted{color:var(--ink-soft)}
.pill-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
@media (max-width:520px){
  .band h1{font-size:22px}.band p{display:none}.logo{height:46px}
  h2{font-size:30px}.score .big{font-size:60px}
}
@media (prefers-reduced-motion:no-preference){
  .opt,.choice{transition:border-color .12s,background .12s}
}
</style>
</head>

    { week:3, title:"Binomial probability, conditional probability, five-number summary", questions:[{"id": "S3-1", "calc": true, "topic": "2.10 Binomial distribution", "prompt": "A basketball player makes 70% of her free throws, and her attempts are independent. She shoots 10 free throws. Which expression gives the probability that she makes exactly 8 of them?", "options": ["C(10,8)(0.3)^8(0.7)^2", "(0.7)^8(0.3)^2", "C(10,8)(0.7)^8(0.3)^2", "C(10,2)(0.7)^2(0.3)^8"], "answer": 2, "why": "Exactly 8 makes and 2 misses: there are C(10,8) ways to choose which 8 attempts are makes, and each way has probability (0.7)^8(0.3)^2. Choice A swaps the success and failure probabilities, B leaves out the number of ways, and D uses the exponents for 2 makes."}, {"id": "S3-2", "calc": true, "topic": "2.6 Conditional probability", "prompt": "A school surveyed 200 students about whether they play a sport. Of the 80 juniors, 40 play a sport. Of the 120 seniors, 36 play a sport. A student who plays a sport is chosen at random. What is the probability that the student is a senior?", "options": ["0.30", "0.47", "0.18", "0.60"], "answer": 1, "why": "Among the 40 + 36 = 76 students who play a sport, 36 are seniors, so the probability is 36/76 ≈ 0.47. Choice A is P(sport | senior) = 36/120, C is P(senior and sport) = 36/200, and D is P(senior) = 120/200."}, {"id": "S3-3", "calc": true, "topic": "1.8 Five-number summary and boxplots", "prompt": "The scores of 40 students on a quiz have this five-number summary: minimum 52, Q1 70, median 78, Q3 86, maximum 100. About how many of the students scored 86 or higher?", "options": ["5", "10", "20", "30"], "answer": 1, "why": "About 75% of the data fall at or below Q3, so about 25% of the 40 students, or 10 students, scored at or above 86."}]},

    { week:5, title:"Central Limit Theorem, residuals, sampling bias", questions:[{"id": "S5-1", "calc": true, "topic": "2.12 Sampling distributions and the Central Limit Theorem", "prompt": "The number of people in a household is strongly right-skewed in a large city, with a mean of 2.6 and a standard deviation of 1.4. Random samples of 50 households are taken, and the mean household size is found for each sample. Which statement describes the sampling distribution of the sample mean?", "options": ["Strongly right-skewed, with a mean of 2.6 and a standard deviation of 1.4", "Approximately normal, with a mean of 2.6 and a standard deviation of 1.4", "Approximately normal, with a mean of 2.6 and a standard deviation of about 0.20", "Approximately normal, with a mean of about 0.37 and a standard deviation of about 0.20"], "answer": 2, "why": "With n = 50, the Central Limit Theorem says the sampling distribution of the sample mean is approximately normal even though the population is skewed. Its mean equals the population mean, 2.6, and its standard deviation is 1.4/√50 ≈ 0.20. Only the standard deviation shrinks, not the mean."}, {"id": "S5-2", "calc": true, "topic": "5.4 Residuals", "prompt": "A least-squares regression line for predicting a student’s weight (in kg) from height (in cm) is predicted weight = −60 + 0.9(height). A student who is 170 cm tall weighs 95 kg. What is the residual for this student?", "options": ["−2 kg", "+2 kg", "93 kg", "+0.9 kg"], "answer": 1, "why": "The predicted weight is −60 + 0.9(170) = 93 kg. A residual is the actual value minus the predicted value, so 95 − 93 = +2 kg. This student weighs 2 kg more than the line predicts."}, {"id": "S5-3", "calc": true, "topic": "1.12 Potential problems with sampling", "prompt": "A principal wants to know how students feel about a later start time. She posts a link to an online survey on the school website’s home page, which every student can visit, and uses every response she receives. What is the most likely problem with the results?", "options": ["Undercoverage, because some students were left out of the sampling frame", "Voluntary response bias, because students decide for themselves whether to respond", "Response bias, because the question was worded to favor one answer", "No bias, because a large number of responses is likely"], "answer": 1, "why": "When students choose whether to respond, those with strong opinions are the most likely to answer, so the responses tend not to represent all students. A large number of responses does not fix this. Nothing in the setup points to leading wording, and every student could reach the survey."}]},
    { week:6, title:"Interval claims, sampling distribution of a proportion, independence", questions:[{"id": "S6-1", "calc": true, "topic": "3.4 Justifying a claim based on a confidence interval", "prompt": "A company claims that 30% of its customers prefer its new flavor. In a random sample of customers, a 95% confidence interval for the proportion who prefer the new flavor is (0.22, 0.29). Which conclusion is best supported by the interval?", "options": ["Because 0.29 is close to 0.30, the data support the company’s claim", "Because the interval is below 0.50, a majority of customers prefer the new flavor", "Because 0.30 is not in the interval, 0.30 is not a plausible value for the true proportion, so the data do not support the company’s claim", "Because the interval has a width of 0.07, the sample was too small to say anything"], "answer": 2, "why": "An interval gives the plausible values for the true proportion. Since 0.30 is not one of them, the data do not support the claim. Being close to the interval is not the same as being in it, and an interval below 0.50 says the proportion is below half, not that a majority prefer the flavor."}, {"id": "S6-2", "calc": true, "topic": "3.2 Sampling distributions for sample proportions", "prompt": "In a large population, 40% of people own a certain brand of phone. Random samples of 100 people are taken. What is the standard deviation of the sampling distribution of the sample proportion?", "options": ["0.0024", "0.049", "0.49", "0.40"], "answer": 1, "why": "The standard deviation is √(0.40 × 0.60 / 100) ≈ 0.049. Choice A is the variance, not the standard deviation, C leaves out the division by n, and D is the mean of the sampling distribution."}, {"id": "S6-3", "calc": true, "topic": "2.7 Independent events and unions of events", "prompt": "For two events A and B, P(A) = 0.50, P(B) = 0.40, and P(A and B) = 0.20. Which statement is true?", "options": ["A and B are mutually exclusive because P(A and B) is not 1", "A and B are not independent because P(A and B) is not 0", "A and B are independent because P(A) + P(B) is less than 1", "A and B are independent because P(A and B) = P(A) × P(B)"], "answer": 3, "why": "Events are independent when P(A and B) = P(A) × P(B). Here 0.50 × 0.40 = 0.20, which matches. Mutually exclusive events would have P(A and B) = 0, and that is a different idea from independence."}]},
    { week:7, title:"Intervals for proportions, conditions, experiments", questions:[{"id": "S7-1", "calc": true, "topic": "3.11 Justifying a claim based on an interval for a difference in proportions", "prompt": "A 95% confidence interval for p₁ − p₂, where p₁ is the proportion of all seniors who drive to school and p₂ is the proportion of all juniors who drive to school, is (−0.04, 0.13). Which conclusion is best supported?", "options": ["Seniors are more likely than juniors to drive to school", "Juniors are more likely than seniors to drive to school", "95% of the differences between a senior and a junior fall between −4% and 13%", "Because 0 is in the interval, there is not convincing evidence of a difference between the two proportions"], "answer": 3, "why": "Zero is a plausible value for p₁ − p₂, so the interval does not give convincing evidence that the proportions differ in either direction. An interval for a difference describes a population parameter, not 95% of individual differences."}, {"id": "S7-2", "calc": true, "topic": "3.3 Constructing a confidence interval for a population proportion", "prompt": "A random sample of 80 customers is taken from a very large customer list. In the sample, 12 customers prefer the new flavor. Which check shows that the sample is large enough to use a normal model for a one-proportion confidence interval?", "options": ["80 is greater than 30", "The population is more than 10 times the sample size", "12 ≥ 10 and 80 − 12 = 68 ≥ 10", "0.15 is between 0 and 1"], "answer": 2, "why": "The large counts condition for an interval uses the observed counts of successes and failures, and both should be at least 10. Here 12 and 68 both pass. The sample size alone (choice A) does not check this, and the 10% condition (choice B) checks independence, not sample size."}, {"id": "S7-3", "calc": true, "topic": "1.13 Experimental design", "prompt": "A researcher wants to test whether a new fertilizer increases tomato yield. She randomly assigns 20 of 40 plants to the new fertilizer and the other 20 to the current fertilizer. What is the main purpose of the random assignment?", "options": ["To make the two groups roughly equivalent before treatment, so a difference in yield can be attributed to the fertilizer", "To make the plants in the study representative of all tomato plants", "To make sure every plant gets the same amount of sunlight and water", "To eliminate all variability in the yields"], "answer": 0, "why": "Random assignment spreads other factors, such as soil and sunlight, evenly across the groups on average, so a difference in yield can be attributed to the fertilizer. Representing a larger population depends on random sampling, which is a different idea."}]},
    { week:8, title:"p-values, hypotheses, expected value", questions:[{"id": "S8-1", "calc": true, "topic": "3.6 p-values", "prompt": "A test of H₀: p = 0.50 versus Hₐ: p > 0.50 gives a p-value of 0.03. Which is the correct interpretation of the p-value?", "options": ["There is a 3% chance that H₀ is true", "The sample proportion is 3% above 0.50", "If p is really 0.50, the probability of getting a sample proportion at least as large as the one observed is 0.03", "There is a 97% chance that Hₐ is true"], "answer": 2, "why": "A p-value assumes H₀ is true and tells how likely a result at least this extreme would be by chance alone. It is not the probability that H₀ or Hₐ is true."}, {"id": "S8-2", "calc": true, "topic": "3.5 Setting up a test for a population proportion", "prompt": "A coach claims that his team wins 60% of its games. A skeptical fan believes the team wins less than 60% of its games. Which pair of hypotheses should the fan test, where p is the true proportion of games the team wins?", "options": ["H₀: p̂ = 0.60, Hₐ: p̂ < 0.60", "H₀: p = 0.60, Hₐ: p ≠ 0.60", "H₀: p < 0.60, Hₐ: p = 0.60", "H₀: p = 0.60, Hₐ: p < 0.60"], "answer": 3, "why": "Hypotheses are about a population parameter, p, not a sample statistic, and the null hypothesis states equality. The fan believes the proportion is less than 0.60, which gives a one-sided alternative."}, {"id": "S8-3", "calc": true, "topic": "2.9 Parameters of random variables", "prompt": "In a game, you roll a fair six-sided die. You win $6 if you roll a 6, win $1 if you roll a 5, and lose $2 if you roll any other number. What is the expected value of your winnings on one roll?", "options": ["+$1.17", "−$0.17", "−$1.00", "$0"], "answer": 1, "why": "E(X) = 6(1/6) + 1(1/6) + (−2)(4/6) = 1 + 0.17 − 1.33 ≈ −$0.17. On average you lose about 17 cents per roll."}]},
    { week:9, title:"Chi-square, Type I error, stratified sampling", questions:[{"id": "S9-1", "calc": true, "topic": "3.14 Setting up a chi-square test", "prompt": "A chi-square test for independence is used to see whether grade level and favorite lunch option are related for 200 randomly selected students. For the cell of seniors who prefer pizza, the row total is 60 and the column total is 50. What is the expected count for this cell?", "options": ["12.5", "15", "30", "60"], "answer": 1, "why": "Expected count = (row total)(column total) / grand total = (60)(50) / 200 = 15."}, {"id": "S9-2", "calc": true, "topic": "3.8 Potential errors when performing tests", "prompt": "A researcher tests whether a new drug shortens recovery time compared with the standard treatment. The null hypothesis is that the new drug does not shorten recovery time. Which describes a Type I error in this context?", "options": ["Concluding there is no convincing evidence that the drug shortens recovery time when it actually does", "Failing to reject the null hypothesis when the null hypothesis is true", "Concluding that the drug shortens recovery time when it actually does not", "Concluding that the drug shortens recovery time when it actually does"], "answer": 2, "why": "A Type I error means rejecting a true null hypothesis. Here the null says the drug does not shorten recovery time, so a Type I error is concluding that it does when it really does not. Choice A describes a Type II error, and B and D are correct decisions."}, {"id": "S9-3", "calc": true, "topic": "1.11 Random sampling", "prompt": "A school has 1,200 students, with 300 in each grade. To survey 120 students, an administrator randomly selects 30 students from each grade. Which sampling method is this?", "options": ["Simple random sample", "Stratified random sample", "Cluster sample", "Systematic sample"], "answer": 1, "why": "The students are divided into groups by grade, and a random sample is taken from every group, which is a stratified random sample. It is not a simple random sample, because not every set of 120 students is possible (exactly 30 must come from each grade)."}]},

/* Shared results: the response Sheet, published to the web as CSV. Columns are read by position:
   timestamp, teacher, class, student, set, score, right, picks. */
let REMOTE=[], remoteStatus="";
function parseCSV(s){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cur); cur=""; }
    else if(c==="\n"||c==="\r"){ if(c==="\r"&&s[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; }
    else cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function remoteToRows(table){
  const out=[];
  table.slice(1).forEach(c=>{
    const [ts,teacherName,sectionName,student,setNo,score,right,picks]=c.map(x=>(x||"").trim());
    const teacher=TEACHERS.find(t=>t.name===teacherName); if(!teacher||!student) return;
    const sec=teacher.sections.find(s=>s.name===sectionName||s.id===sectionName); if(!sec) return;
    const week=parseInt(setNo,10); if(!week) return;
    const flags=right?right.split(",").map(x=>x.trim()==="1"?1:0):[];
    const pk=picks?picks.split(",").map(x=>"ABCDE".indexOf(x.trim().toUpperCase())):[];
    out.push({remote:true,key:studentKey(teacher.id,sec.id,student),teacherId:teacher.id,teacherName:teacher.name,sectionId:sec.id,sectionName:sec.name,
      student,week,flags,picks:(pk.length&&pk.every(i=>i>=0))?pk:null,order:null,
      score:Number.isFinite(parseInt(score,10))?parseInt(score,10):flags.reduce((a,b)=>a+b,0),t:Date.parse(ts)||0});
  });
  return out;
}
async function refreshRemote(){
  if(!CONFIG.sheetCsvUrl) return false;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
    const res=await fetch(CONFIG.sheetCsvUrl+(CONFIG.sheetCsvUrl.includes("?")?"&":"?")+"cb="+Date.now(),{signal:ctl.signal});
    clearTimeout(to);
    if(!res.ok) throw new Error("status "+res.status);
    REMOTE=remoteToRows(parseCSV(await res.text()));
    remoteStatus="ok:"+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
    return true;
  }catch(e){ remoteStatus="fail"; return false; }
}
function allRows(){ return loadAll().concat(REMOTE); }

function h(tag,attrs,...kids){

  for(const k in (attrs||{})){
    const v=attrs[k];
    if(k==="class") el.className=v; else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,""); else if(v!==false&&v!=null) el.setAttribute(k,v);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; el.append(c.nodeType?c:document.createTextNode(c)); });
  return el;
}
function show(...nodes){ app.replaceChildren(...nodes.flat().filter(n=>n!=null)); window.scrollTo(0,0); }
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
const LET=["A","B","C","D","E"];

function nameOf(p){ return p[0]+", "+p[1]; }
/* Student-facing label: First name + last initial. If two students in a class would look identical, add letters from the last name. */
function labelFor(section,p){
  if(!section._labels){
    const groups={}, labels={};
    const gk=q=>(q[1]+"|"+q[0][0]).toLowerCase();
    section.roster.forEach(q=>{ (groups[gk(q)]=groups[gk(q)]||[]).push(q); });
    section.roster.forEach(q=>{
      const g=groups[gk(q)]; let n=1;
      if(g.length>1){ while(n<q[0].length && g.some(o=>o!==q && o[0].slice(0,n).toLowerCase()===q[0].slice(0,n).toLowerCase())) n++; }
      labels[nameOf(q)]=q[1]+" "+q[0].slice(0,n)+(n<q[0].length?".":"");
    });
    section._labels=labels;
  }
  return section._labels[nameOf(p)];
}
function teacherById(id){ return TEACHERS.find(t=>t.id===id); }
function rosterSize(t){ return t.sections.reduce((n,s)=>n+s.roster.length,0); }

    :remoteStatus.startsWith("ok")?"Shared results from the Sheet, checked at "+remoteStatus.slice(3)+". New submissions can take a few minutes to appear."
    :"Could not reach the shared Sheet, so only results saved in this browser are showing.";

  const tabs=h("div",{class:"row"},info.map(x=>h("button",{class:"btn small"+(x.c.id===cur.c.id?"":" ghost"),type:"button",disabled:!x.ready,
    onclick:()=>{T.course=x.c.id;T.teacherId="all";T.weekPicked=false;T.openSection=null;teacherDash();}},x.c.name+(x.ready?"":" (not set up yet)"))));
  const tSel=cts.length>1?h("select",{"aria-label":"Teacher",onchange:e=>{T.teacherId=e.target.value;T.openSection=null;teacherDash();}},
    [h("option",{value:"all",selected:T.teacherId==="all"},"All "+cur.c.name+" teachers")].concat(
      cts.map(t=>h("option",{value:t.id,selected:t.id===T.teacherId},t.name+(t.placeholder?" (placeholder roster)":""))))):
    h("span",{class:"muted"},"Teacher: "+(cts[0]?cts[0].name:"none"));
  const wSel=h("select",{"aria-label":"Set",onchange:e=>{T.week=+e.target.value;T.weekPicked=true;T.openSection=null;teacherDash();}},
    sets.map(w=>h("option",{value:w.week,selected:w.week===wk},"Set "+w.week+": "+w.title)));
  const scopeName=cur.c.name+", "+(scopeTs.length===1?scopeTs[0].name:"all teachers")+", Set "+wk;

  const done=weekRows.length, avg=avgOf(weekRows);
  const cards=h("div",{class:"cards"},
    h("div",{class:"stat"},h("div",{class:"n"},size?pct(done/size):"—"),h("div",{class:"l"},done+" of "+size+" students completed Set "+wk)),
    h("div",{class:"stat"},h("div",{class:"n"},avg==null?"—":pct(avg)),h("div",{class:"l"},"Average score on Set "+wk)));

  const teacherTable=scopeTs.length>1?table(["Teacher","Completed","Participation","Average score"],scopeTs.map(t=>{
    const rs=weekRows.filter(r=>r.teacherId===t.id), sz=rosterSize(t);
    return h("tr",null,h("td",null,h("strong",null,t.name),t.placeholder?h("span",{class:"tag warn",style:"margin-left:8px"},"Placeholder roster"):null),
      h("td",null,rs.length+" of "+sz),h("td",null,cell(sz?rs.length/sz:null)),h("td",null,avgOf(rs)==null?"—":pct(avgOf(rs))));
  })):null;

  const classes=scopeTs.flatMap(t=>t.sections.map(s=>{
    const rs=weekRows.filter(r=>r.teacherId===t.id&&r.sectionId===s.id);
    return {t,s,key:t.id+"|"+s.id,rs,size:s.roster.length};
  }));
  const toggle=key=>{T.openSection=T.openSection===key?null:key;teacherDash();};
  const multi=scopeTs.length>1;
  const classTable=table((multi?["Teacher"]:[]).concat(["Class","Completed","Participation","Average score"]),classes.map(c=>
    h("tr",{class:"click",tabindex:"0",onclick:()=>toggle(c.key),onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(c.key);}}},
      multi?h("td",null,c.t.name):null,h("td",null,h("strong",null,c.s.name)),h("td",null,c.rs.length+" of "+c.size),
      h("td",null,cell(c.size?c.rs.length/c.size:null)),h("td",null,avgOf(c.rs)==null?"—":pct(avgOf(c.rs))))));
  let missing=null;
  if(T.openSection){
    const c=classes.find(x=>x.key===T.openSection);
    if(c){
      const doneNames=new Set(c.rs.map(x=>x.student));
      const miss=c.s.roster.filter(p=>!doneNames.has(labelFor(c.s,p))).map(nameOf);
      missing=h("div",null,h("h3",null,(multi?c.t.name+" ":"")+"Class "+c.s.name+": not yet completed ("+miss.length+")"),
        miss.length?h("div",{class:"pill-list"},miss.map(n=>h("span",{class:"tag warn"},n))):h("p",{class:"muted"},"Everyone has completed this set."));
    }
  }
  const qTable=table(["Question","Topic","Percent correct"],wkDef.questions.map((q,i)=>{
    const c=weekRows.filter(r=>r.flags[i]===1).length, f=weekRows.length?c/weekRows.length:null;
    return h("tr",null,h("td",null,"Question "+(i+1)),h("td",null,q.topic),h("td",null,cell(f,pct(f||0)+" ("+weekRows.length+" students)")));
  }));
  const setsTable=table(["Set","Completed","Participation","Average score"],sets.map(w=>{
    const rs=scopeRows.filter(r=>r.week===w.week);
    const pick=()=>{T.week=w.week;T.weekPicked=true;T.openSection=null;teacherDash();};
    return h("tr",{class:"click",tabindex:"0",onclick:pick,onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}}},
      h("td",null,w.week===wk?h("strong",null,"Set "+w.week+": "+w.title):"Set "+w.week+": "+w.title),
      h("td",null,rs.length+" of "+size),h("td",null,cell(size?rs.length/size:null)),h("td",null,avgOf(rs)==null?"—":pct(avgOf(rs))));
  }));

  show(
    h("h2",null,"Department results"),
    tabs,
    h("div",{class:"row"},tSel,wSel,CONFIG.sheetCsvUrl?h("button",{class:"btn small",type:"button",onclick:()=>{T.synced=false;teacherDash();}},"Refresh results"):null),
    h("p",{class:"muted"},scopeName+". "+src+(demoOn?" Sample data is also showing (this browser only).":"")),
    !hasData?h("p",{class:"notice"},"No responses yet. Load sample data to preview the dashboard, or have a student complete a set."):null,
    cards,
    teacherTable?h("h3",null,"By teacher"):null,teacherTable,
    h("h3",null,"By class"),
    h("p",{class:"muted"},"Select a class row to see who has not completed this set."),
    classTable,missing||null,
    h("h3",null,"Question results for Set "+wk),qTable,
    h("h3",null,"All sets at a glance"),
    h("p",{class:"muted"},"Select a row to look at that set."),
    setsTable,
    h("h3",null,"Sample data"),
    h("div",{class:"row"},
      h("button",{class:"btn small ghost",type:"button",onclick:()=>{seedDemo();teacherDash();}},"Load sample data"),
      h("button",{class:"btn small ghost",type:"button",onclick:()=>{saveAll(loadAll().filter(r=>!r.demo));teacherDash();}},"Remove sample data"),
      h("button",{class:"btn small ghost",type:"button",onclick:()=>{ if(confirm("Delete the responses saved in this browser? Shared results in the Sheet are not affected.")){saveAll([]);teacherDash();} }},"Clear this browser"))
  );
}


studentCourse();
</script>
</body>
</html>
